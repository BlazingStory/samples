events {
    worker_connections 1024;
}

http {
    # WebSocket connection upgrade control
    # Dynamically set the Connection header value based on the $http_upgrade header
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream blazor_backend {
        # Specify the Blazor Server app running in the same container.
        server 127.0.0.1:5000;
    }

    server {
        listen 80;
        server_name localhost;

        # Mount Blazor app under /foo path
        location /foo {
            proxy_pass http://blazor_backend;
            proxy_http_version 1.1;
            
            # WebSocket support (required for Blazor Server)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Other headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}